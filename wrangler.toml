name = "project911"
main = "worker.js"
compatibility_date = "2026-07-18"

routes = [
  { pattern = "logicweaver.me/*", zone_name = "logicweaver.me" },
  { pattern = "www.logicweaver.me/*", zone_name = "logicweaver.me" },
]

[assets]
directory = "./out"
binding = "ASSETS"
# Keep proxy validation ahead of static asset/navigation routing.
run_worker_first = ["/vps", "/vps/*", "/bili", "/bili/*", "/siren", "/siren/*", "/aihot", "/aihot/*", "/lyric", "/__version"]
not_found_handling = "404-page"
